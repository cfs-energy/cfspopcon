name: CI/CD Pipeline

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run re-resolves dependencies within the pyproject ranges. schedule fires only from the default branch.
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs that need more (publish) declare their own permissions.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- JOB 1: GENERATE RADAS DATA ---
  # The radas calculation runs on every CI run, so the tests always see output
  # from the radas version in poetry.lock. Only the downloaded OpenADAS files
  # (radas_dir/data_files) are cached, keyed on radas_config.yaml, since they
  # depend only on which species and years the config requests.
  radas:
    name: Generate Radas Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      # Scheduled runs re-resolve within the pyproject ranges instead of using poetry.lock
      # (the test job does the same), so the radas output matches the tests' environment.
      - name: Re-resolve dependencies
        if: github.event_name == 'schedule'
        run: poetry --no-interaction update

      - name: Cache OpenADAS data files
        uses: actions/cache@v5
        with:
          path: ./radas_dir/data_files
          key: radas-data-files-${{ hashFiles('radas_config.yaml') }}

      - name: Make radas data
        run: poetry run radas -c radas_config.yaml

      - name: Upload radas output
        uses: actions/upload-artifact@v7
        with:
          name: radas_output
          path: ./radas_dir/output
          retention-days: 30

  # --- JOB 2: TEST ---
  # The heavy work: unit tests, regression tests and the packaged smoke test,
  # run across the supported Python versions. Needs the radas data.
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: radas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Download radas output
        uses: actions/download-artifact@v8
        with:
          name: radas_output
          path: ./radas_dir/output

      # Scheduled runs re-resolve within the pyproject ranges instead of using poetry.lock,
      # so we find out when a new release of a dependency breaks the tests.
      - name: Re-resolve dependencies
        if: github.event_name == 'schedule'
        run: |
          poetry --no-interaction update
          poetry show --top-level --no-truncate

      - name: Run Tests
        env:
          MPLBACKEND: Agg
        run: poetry run pytest tests --nbmake example_cases -m "not docs"

      - name: Regression Tests
        env:
          MPLBACKEND: Agg
        run: |
          poetry run python tests/utils/regression_results.py
          poetry run pytest --no-cov tests/test_regression_against_cases.py

      - name: Upload regression results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression_results-${{ matrix.python-version }}
          path: tests/regression_results

      - name: Smoke test package
        env:
          MPLBACKEND: Agg
        run: |
          poetry build -f wheel
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          mkdir tmp_dir && cd tmp_dir
          popcon ../example_cases/SPARC_PRD -d radas_dir WORKING_DIR/../radas_dir

  # --- JOB 3: LINT AND TYPE CHECK ---
  # pre-commit (ruff, ty, variable-consistency check). Independent of the
  # radas data, so it runs in parallel with everything else for fast feedback.
  lint:
    name: Lint and type check (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Pre-commit checks
        run: poetry run pre-commit run --show-diff-on-failure --color=always --all-files

  # --- DEPENDENCY REVIEW: FAIL PRS THAT ADD OR BUMP A VULNERABLE DEPENDENCY ---
  # Pull requests only, and deliberately not in build_release's needs: a skipped job would skip the release.
  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  # --- JOB 4: DOCUMENTATION ---
  # Sphinx build (warnings as errors) and doctests. Notebooks are not executed
  # (nbsphinx_execute = "never"), so this is independent of the radas data and
  # runs in parallel with everything else. Link checking runs separately on a
  # schedule (see linkcheck.yml) so flaky external links can't block a PR.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Documentation tests
        run: |
          cd docs
          poetry run sphinx-build --keep-going -Wnb html . _build/
          poetry run make doctest

  # --- JOB 5: PREPARE RELEASE ---
  build_release:
    name: Build Release
    if: startsWith(github.ref, 'refs/tags')
    needs: [test, lint, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Build distributions
        run: poetry build

      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-build
          path: ./dist
          retention-days: 1

  # --- JOB 6: PUBLISH ---
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags')
    needs: build_release
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/cfspopcon/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: pypi-build
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
