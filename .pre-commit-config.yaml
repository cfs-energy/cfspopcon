# per default we only run over the files in the python package
default_install_hook_types: [pre-commit, commit-msg]  # one `pre-commit install` sets up both

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        # but no large files anywhere ;)
        files: ''
        exclude: ".*getting_started.ipynb"
-   repo: local
    hooks:
      - id: ruff_format
        name: ruff_format 
        entry: poetry run ruff format
        language: system
        types: [python]
-   repo: local
    hooks:
      - id: ruff_check
        name: ruff_check
        entry: poetry run ruff check
        language: system
        types: [python]
        files: '^cfspopcon/'
-   repo: local
    hooks:
      # ty is pinned in pyproject.toml, since its diagnostics change between releases.
      - id: ty
        name: ty check
        entry: poetry run ty check
        language: system
        types: [python]
        pass_filenames: false
-   repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution trailers in commit messages
        entry: '(?i)(^co-authored-by: claude .*<noreply@anthropic\.com>|generated with \[claude code\])'
        language: pygrep
        stages: [commit-msg]
-   repo: local
    hooks:
      - id: check_variables
        name: Check variables
        entry: poetry run python tests/utils/variable_consistency_checker.py --run
        language: system
        pass_filenames: false
        always_run: true
